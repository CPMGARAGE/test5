<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming soon - TerminalTanks</title>
<meta name="description" content="What is being added to TerminalTanks next.">
<meta name="theme-color" content="#05090f">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Coming soon - TerminalTanks">
<meta property="og:description" content="What is being added to TerminalTanks next.">
<meta property="og:image" content="https://ethanlabs101.github.io/TerminalTanks/preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ethanlabs101.github.io/TerminalTanks/coming-soon.html">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="soon">
<main data-title="INCOMING" data-chip="IN DEVELOPMENT">
  <h2>WHAT IS NEXT</h2>
  <p class="lead">The next additions to TerminalTanks, in the order they are likely to land.</p>
  <div id="list"></div>
  <p class="muted">Dates are not promised. New releases are announced on <a href="https://github.com/ethanlabs101/TerminalTanks" target="_blank" rel="noopener">GitHub</a>.</p>
</main>
<script src="site.js"></script>
<script>
/* The list lives in roadmap.json. status is "Building", "Designing" or "Planned". */
fetch('roadmap.json').then((r) => r.json()).then((j) => {
  document.getElementById('list').innerHTML = j.next.map((n) => '<div class="soon"><h3>' + n.name + '</h3><div class="' + (n.status === 'Building' ? 'warn' : 'muted') + '">' + n.status + '</div><p>' + n.text + '</p></div>').join('');
}).catch(() => { document.getElementById('list').innerHTML = '<p class="muted">The list could not be loaded. Reload the page to try again.</p>'; });
</script>
</body>
</html>
