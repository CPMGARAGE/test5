<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalog - TerminalTanks</title>
<meta name="description" content="Every tank, shell, map and home screen in TerminalTanks, and how to unlock each one.">
<meta name="theme-color" content="#05090f">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Catalog - TerminalTanks">
<meta property="og:description" content="Every tank, shell, map and home screen in TerminalTanks, and how to unlock each one.">
<meta property="og:image" content="https://ethanlabs101.github.io/TerminalTanks/preview.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://ethanlabs101.github.io/TerminalTanks/catalog.html">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="catalog">
<main data-title="CATALOG">
  <h2>EVERYTHING YOU CAN UNLOCK</h2>
  <p class="lead">154 tanks, ammo types, maps, home screens and features, with where each one comes from.</p>
  <input class="find" id="q" type="search" placeholder="Search by name or description" aria-label="Search the catalog">
  <div class="filters" id="kinds" role="group" aria-label="Filter by type"></div>
  <div class="filters" id="hows" role="group" aria-label="Filter by source"></div>
  <p class="muted" id="n"></p>
  <div class="items" id="items"></div>
</main>
<script src="site.js"></script>
<script>
(async function () {
  const K = { all: 'All', tank: 'Tanks', ammo: 'Ammo', map: 'Maps', theme: 'Home screens', feature: 'Features' };
  const T = { tank: 'TANK', ammo: 'AMMO', map: 'MAP', theme: 'HOME SCREEN', feature: 'FEATURE' };
  const H = { all: 'Any source', Shop: 'Shop', Tournament: 'Tournament', Mission: 'Missions', 'Cheat only': 'Cheat only' };
  let data = [], kind = 'all', how = 'all';
  try { data = await (await fetch('catalog.json')).json(); } catch (e) { document.getElementById('n').textContent = 'The catalog could not be loaded. Reload the page to try again.'; return; }
  const bar = (id, map, get, set) => { const el = document.getElementById(id); el.innerHTML = Object.entries(map).map(([k, v]) => '<button type="button" class="btn kb" data-k="' + k + '">' + v + '</button>').join(''); el.onclick = (e) => { if (e.target.dataset.k) { set(e.target.dataset.k); render(); } }; return el; };
  const kb = bar('kinds', K, () => kind, (v) => { kind = v; }), hb = bar('hows', H, () => how, (v) => { how = v; });
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const rows = data.filter((d) => (kind === 'all' || d.k === kind) && (how === 'all' || d.h.startsWith(how)) && (!q || (d.n + ' ' + d.b).toLowerCase().includes(q)));
    [...kb.children].forEach((b) => b.classList.toggle('on', b.dataset.k === kind)); [...hb.children].forEach((b) => b.classList.toggle('on', b.dataset.k === how));
    document.getElementById('n').textContent = rows.length + ' of ' + data.length + ' shown';
    document.getElementById('items').innerHTML = rows.length ? rows.map((d) => '<div class="item" data-k="' + d.k + '"><span class="type">' + T[d.k] + '</span><b>' + esc(d.n) + '</b><p>' + esc(d.b) + '</p><div class="how' + (d.h === 'Cheat only' ? ' cheat' : '') + '">' + esc(d.h) + (d.c ? ', ' + d.c : '') + '</div></div>').join('') : '<p class="muted">Nothing matches. Clear the search or choose another filter.</p>';
  }
  document.getElementById('q').oninput = render; render();
})();
</script>
</body>
</html>
